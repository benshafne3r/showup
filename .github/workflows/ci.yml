name: CI

# Runs on every push to main (and on demand): type check, lint and unit tests,
# then the full Playwright suite against a throwaway local Supabase stack with
# mock payments + console email. Nothing here touches the live project.
# A failed run emails the repo owner (GitHub's default notifications).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (all migrations)
        run: supabase start -x realtime,edge-runtime,logflare,vector,imgproxy,supavisor,studio

      - name: Point the app at the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3111"
            echo "PAYMENT_PROVIDER=mock"
            echo "MOCK_WEBHOOK_SECRET=ci-mock-webhook-secret"
            echo "EMAIL_PROVIDER=console"
            echo "CRON_SECRET=ci-cron-secret"
            echo "OWNER_EMAILS=label.owner@demo.showup.test"
          } > .env.local

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
